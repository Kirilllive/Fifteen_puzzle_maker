<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifteen Puzzle Maker Pro</title>
    <meta name="theme-color" content="#c4cebb">
    <meta name="description" content="A robust implementation of the classic mini-game Fifteen Sliding Puzzle.">
    <style>
        :root {
            --primary: #c4cebb;
            --primary-hover: #b3c0a8;
            --bg: #dfebd5;
            --panel: #ffffff;
            --text: #333333;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            outline: none;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            color: var(--text);
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background-color: var(--panel);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--primary);
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .settings-group {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-row label {
            font-size: 13px;
            font-weight: 500;
        }

        .input-text {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            width: 120px;
            transition: border 0.2s;
            user-select: text;
        }

        .input-text:focus {
            border-color: var(--primary);
        }

        .input-full {
            width: 100%;
            margin-top: 5px;
        }

        /* Button Styling */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-generate { background-color: #8fb177; }
        .btn-generate:hover { background-color: #7d9c67; }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Preview Area */
        .preview-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        #drop-zone {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 3px dashed var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #888;
            background: rgba(255,255,255,0.4);
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #drop-zone.active { opacity: 1; }
        #fifteen-preview { z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- Sidebar Settings -->
    <div class="sidebar">
        <div class="sidebar-header">Puzzle Maker Pro</div>
        
        <div class="settings-group">
            <button class="btn" onclick="document.getElementById('img_file').click();">📁 Load Image</button>
            <input id="img_file" type="file" accept="image/png, image/gif, image/jpeg, image/webp" />
            
            <div class="control-row">
                <label>Difficulty (Shuffles)</label>
                <input type="number" id="diff" class="input-text" value="100">
            </div>
            <div class="control-row">
                <label>Width (px)</label>
                <input type="number" id="width" class="input-text" value="400">
            </div>
            <div class="control-row">
                <label>Height (px)</label>
                <input type="number" id="height" class="input-text" value="400">
            </div>
            <div class="control-row">
                <label>Grid X (Columns)</label>
                <input type="number" id="grid_x" class="input-text" value="3">
            </div>
            <div class="control-row">
                <label>Grid Y (Rows)</label>
                <input type="number" id="grid_y" class="input-text" value="3">
            </div>
            <div class="control-row">
                <label>Move Time (sec)</label>
                <input type="number" step="0.1" id="time" class="input-text" value="0.2">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 5px 0;">

            <div class="control-row">
                <label>Show Numbers</label>
                <label class="switch"><input type="checkbox" id="show_numbers"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <label>Auto-Fill Screen</label>
                <label class="switch"><input type="checkbox" id="fill_screen" checked><span class="slider"></span></label>
            </div>
            
            <div>
                <label style="font-size: 13px; font-weight: 500;">Tile Custom CSS</label>
                <textarea id="slot_style" class="input-text input-full" rows="3">background-color:#c4cebb;display:grid;justify-items:center;align-items:center;font-family:Arial;color:#fff;border-radius:8px;font-size:24px;box-shadow:inset 0 0 10px rgba(0,0,0,0.2);</textarea>
            </div>

            <button class="btn" onclick="updatePreview()">🔄 Refresh Preview</button>
            <button class="btn btn-generate" onclick="generateGame()">⬇️ Download HTML Game</button>
        </div>
    </div>

    <!-- Main Preview Area -->
    <div class="preview-area" id="preview-area">
        <div id="drop-zone">Drop Image Here</div>
        <div id="fifteen-preview"></div>
    </div>

<script>
"use strict";

const config = {
    diff: 100,
    size: [400, 400],
    grid: [3, 3],
    fill: true,
    number: false,
    art: { url: "", ratio: false },
    time: 0.2,
    style: ""
};

let activeFile = null;

// --- Event Listeners ---
document.getElementById('img_file').addEventListener('change', (e) => handleFile(e.target.files[0]));

['diff', 'width', 'height', 'grid_x', 'grid_y', 'time'].forEach(id => {
    document.getElementById(id).addEventListener('change', updateConfigFromUI);
});
['show_numbers', 'fill_screen'].forEach(id => {
    document.getElementById(id).addEventListener('change', updateConfigFromUI);
});
document.getElementById('slot_style').addEventListener('change', updateConfigFromUI);

// --- Drag & Drop ---
const previewArea = document.getElementById('preview-area');
const dropZone = document.getElementById('drop-zone');

previewArea.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
previewArea.addEventListener('dragleave', () => dropZone.classList.remove('active'));
previewArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('active');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

// --- Logic ---
function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return alert("Please upload a valid image file.");
    activeFile = file;
    const url = window.URL.createObjectURL(file);
    config.art.url = url;
    
    const img = new Image();
    img.onload = () => {
        config.size = [img.width, img.height];
        document.getElementById('width').value = img.width;
        document.getElementById('height').value = img.height;
        autoGrid(img.width, img.height);
        updatePreview();
    };
    img.src = url;
}

function autoGrid(w, h) {
    const ratio = w / h;
    let gx = 3, gy = 3;
    if (ratio > 1.2) { gx = 4; gy = 3; }
    else if (ratio < 0.8) { gx = 3; gy = 4; }
    
    document.getElementById('grid_x').value = gx;
    document.getElementById('grid_y').value = gy;
    config.grid = [gx, gy];
}

function updateConfigFromUI() {
    config.diff = parseInt(document.getElementById('diff').value) || 100;
    config.size = [parseInt(document.getElementById('width').value), parseInt(document.getElementById('height').value)];
    config.grid = [parseInt(document.getElementById('grid_x').value), parseInt(document.getElementById('grid_y').value)];
    config.time = parseFloat(document.getElementById('time').value) || 0.2;
    config.number = document.getElementById('show_numbers').checked;
    config.fill = document.getElementById('fill_screen').checked;
    config.style = document.getElementById('slot_style').value;
    updatePreview();
}

function updatePreview() {
    if (!config.art.url) return;
    updateConfigFromUI(); // Ensure sync
    
    const container = document.getElementById('fifteen-preview');
    container.innerHTML = "";
    container.style.width = config.size[0] + 'px';
    container.style.height = config.size[1] + 'px';
    container.style.position = 'relative';
    container.style.transform = `scale(${Math.min(1, (window.innerHeight - 80) / config.size[1], (window.innerWidth - 360) / config.size[0])})`;

    const slotW = config.size[0] / config.grid[0];
    const slotH = config.size[1] / config.grid[1];

    for (let y = 0; y < config.grid[1]; y++) {
        for (let x = 0; x < config.grid[0]; x++) {
            if (x === config.grid[0] - 1 && y === config.grid[1] - 1) continue; // Empty slot
            
            const slot = document.createElement('div');
            slot.style.cssText = `position:absolute; width:${slotW}px; height:${slotH}px; left:${x * slotW}px; top:${y * slotH}px; cursor:pointer; background-image:url(${config.art.url}); background-size:${config.size[0]}px ${config.size[1]}px; background-position:-${x * slotW}px -${y * slotH}px; transition:all ${config.time}s ease; box-sizing:border-box; ${config.style}`;
            
            if (config.number) slot.innerText = (y * config.grid[0] + x + 1);
            container.appendChild(slot);
        }
    }
}

// --- Generator & Exporter ---
function generateGame() {
    if (!activeFile) return alert("Please upload an image first.");

    const reader = new FileReader();
    reader.readAsDataURL(activeFile);
    reader.onload = () => {
        const base64Img = reader.result;
        
        // Deep copy config and replace URL with Base64 for offline portability
        const exportConfig = JSON.parse(JSON.stringify(config));
        exportConfig.art.url = base64Img;

        // The Self-Contained Engine Script Template
        const engineScript = `
            const config = ${JSON.stringify(exportConfig)};
            class FifteenPuzzle {
                constructor(cfg) {
                    this.cfg = cfg;
                    this.container = document.getElementById('game-board');
                    this.tiles = [];
                    this.emptyTile = { x: cfg.grid[0] - 1, y: cfg.grid[1] - 1 };
                    this.slotW = cfg.size[0] / cfg.grid[0];
                    this.slotH = cfg.size[1] / cfg.grid[1];
                    this.isShuffling = false;
                    this.init();
                }

                init() {
                    this.container.style.width = this.cfg.size[0] + 'px';
                    this.container.style.height = this.cfg.size[1] + 'px';
                    this.container.style.position = 'relative';
                    
                    if (this.cfg.fill) {
                        const scale = Math.min(window.innerWidth / this.cfg.size[0], window.innerHeight / this.cfg.size[1]) * 0.95;
                        this.container.style.transform = \`scale(\${scale})\`;
                        window.addEventListener('resize', () => this.init());
                    }

                    let count = 1;
                    for (let y = 0; y < this.cfg.grid[1]; y++) {
                        for (let x = 0; x < this.cfg.grid[0]; x++) {
                            if (x === this.cfg.grid[0] - 1 && y === this.cfg.grid[1] - 1) continue;

                            const tile = document.createElement('div');
                            tile.style.cssText = \`position:absolute; width:\${this.slotW}px; height:\${this.slotH}px; cursor:pointer; background-image:url('\${this.cfg.art.url}'); background-size:\${this.cfg.size[0]}px \${this.cfg.size[1]}px; background-position:-\${x * this.slotW}px -\${y * this.slotH}px; transition:transform \${this.cfg.time}s ease; box-sizing:border-box; \${this.cfg.style}\`;
                            
                            if (this.cfg.number) tile.innerText = count++;
                            
                            const tileData = { dom: tile, cx: x, cy: y, origX: x, origY: y };
                            this.tiles.push(tileData);
                            this.updateTilePos(tileData);
                            
                            tile.addEventListener('click', () => this.moveTile(tileData));
                            this.container.appendChild(tile);
                        }
                    }
                    this.shuffle();
                }

                updateTilePos(t) {
                    t.dom.style.transform = \`translate(\${t.cx * this.slotW}px, \${t.cy * this.slotH}px)\`;
                }

                moveTile(t) {
                    const dx = Math.abs(t.cx - this.emptyTile.x);
                    const dy = Math.abs(t.cy - this.emptyTile.y);
                    if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                        const tempX = this.emptyTile.x; const tempY = this.emptyTile.y;
                        this.emptyTile.x = t.cx; this.emptyTile.y = t.cy;
                        t.cx = tempX; t.cy = tempY;
                        this.updateTilePos(t);
                        if (!this.isShuffling) this.checkWin();
                    }
                }

                shuffle() {
                    this.isShuffling = true;
                    this.container.style.pointerEvents = 'none';
                    let moves = this.cfg.diff;
                    let lastTile = null;

                    const step = () => {
                        if (moves <= 0) {
                            this.isShuffling = false;
                            this.container.style.pointerEvents = 'auto';
                            return;
                        }
                        const neighbors = this.tiles.filter(t => 
                            ((Math.abs(t.cx - this.emptyTile.x) === 1 && t.cy === this.emptyTile.y) || 
                            (Math.abs(t.cy - this.emptyTile.y) === 1 && t.cx === this.emptyTile.x)) && t !== lastTile
                        );
                        const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
                        if (pick) {
                            lastTile = pick;
                            this.moveTile(pick);
                        }
                        moves--;
                        setTimeout(step, 5); // Fast shuffle animation
                    };
                    step();
                }

                checkWin() {
                    const won = this.tiles.every(t => t.cx === t.origX && t.cy === t.origY);
                    if (won) setTimeout(() => alert("Puzzle Solved! Great job!"), this.cfg.time * 1000 + 50);
                }
            }
            window.onload = () => new FifteenPuzzle(config);
        `;

        const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Puzzle Game</title>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #2c3e50; overflow: hidden; }
        #game-board { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-board"></div>
    <script>${engineScript}<\/script>
</body>
</html>`;

        // Create Blob and trigger download
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "fifteen_puzzle_game.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };
}
</script>
</body>
</html>
